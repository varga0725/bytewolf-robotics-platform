    <!-- Indexing is opt-in per deployment, through Vite's own build-time
         substitution rather than a post-processing step. A preview origin

         safe one: without VITE_ROBOTS set, the page says noindex. -->
    <meta name="robots" content="%VITE_ROBOTS%" />
    <link rel="canonical" href="%VITE_CANONICAL_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ByteWolf Robotics" />
