# Versioned pin of the simulation stack the X500 V2 twin is validated against.
#
# PX4-Autopilot is third-party source that lives outside this repository and is
# git-ignored, so nothing in a clean checkout would otherwise say which tree the
# evidence came from. This file is that record: `python -m simulation.baseline`
# compares a local environment against it and fails closed on any drift.
#
# Every hash is sha256 of the file's bytes.
#
# v0.2 introduces host profiles. The twin is now built on two hosts, and two
# properties genuinely differ between them: PX4 v1.17.0 does not build on Apple
# Silicon unpatched, and the Gazebo release available to each host is not the
# same. Everything that does *not* differ stays outside `profiles` and must hold
# on every host, so a real drift cannot hide behind a profile.
version: v0.2

# Compatibility fallback when host auto-detection is unavailable. Evidence now
# exists on both host profiles and remains labelled per host; this default does
# not make macOS the only or preferred evidence environment.
default_profile: macos

profiles:
  macos:
    # PX4 v1.17.0 does not build on Apple Silicon macOS as released: C++17,
    # Apple warning suppressions, the Homebrew library path, and the
    # shared-library suffix the optical flow build assumes. The tree therefore
    # reports itself as `v1.17.0-dirty`; that is expected, not drift.
    required_patch: simulation/px4/macos-build.patch
    gazebo_sim_version: 8.12.0
    # The four files the patch above rewrites, in their patched form.
    files:
      CMakeLists.txt: f50262c828681b3a04945d665ba28bc249ca2fc1b930a03bdb6dbd91b9ccecd3
      src/modules/simulation/gz_msgs/CMakeLists.txt: e4e916ff34cc45ecdcb72a5f1b4dbac83062334ed64496a99031cf0d84c58cd3
      src/modules/simulation/gz_plugins/moving_platform_controller/MovingPlatformController.cpp: cf6e11c0399a4bafe68411dbaf1e89f23ffc1f6eabc2ff46854558b8d682af9c
      src/modules/simulation/gz_plugins/optical_flow/optical_flow.cmake: 52e187a2d3ce4bec08da38baa0d3fe0af4c3a1ee4e9663150410f6fc4973a8e4

  linux:
    # x86_64 Linux is the platform PX4 v1.17.0 targets natively, so the tree
    # needs no patch and reports a clean `v1.17.0`. Applying the macOS patch
    # here would be wrong, not merely unnecessary: its Homebrew library paths do
    # not exist on this host.
    required_patch: null
    # The OSR Foundation stable archive ships only 8.14.0 for jammy; 8.12.0 is
    # not archived, so this host cannot reproduce the macOS Gazebo exactly.
    #
    # Measured on 2026-08-03 rather than assumed: five P0.v2 rounds on 8.14.0
    # gave median airborne hover tilts of 2.4158 +/- 0.0291 deg (3 m/s),
    # 4.8779 +/- 0.0732 deg (6 m/s) and 8.1860 +/- 0.0494 deg (10 m/s), against
    # single recorded macOS 8.12.0 points of 2.5029, 4.8936 and 8.2445 deg.
    # The differences are <= 0.09 deg (<= 3.5%) with a consistent sign. Because
    # only one macOS sample per speed exists, its own run-to-run scatter is
    # unmeasured, and this difference is explained equally well by a version
    # difference or by macOS-side sampling noise. Wind evidence recorded here
    # may therefore sit alongside the macOS wind evidence but is not numerically
    # identical to it. Settling this needs repeated macOS runs.
    gazebo_sim_version: 8.14.0
    # The same four files, unpatched, straight from v1.17.0.
    files:
      CMakeLists.txt: 6dc044ac42624d9899e064bd4693923fc2ee277291e7eecc280a91edca0e2975
      src/modules/simulation/gz_msgs/CMakeLists.txt: e4527a77e334688078671afa3f07bdad10ce5039a3a3b52115b0891758c6631b
      src/modules/simulation/gz_plugins/moving_platform_controller/MovingPlatformController.cpp: 8a2e8b5614bf4afb323ad0dd8583368007a2dad6ef682e39ee71e4e36e698daa
      src/modules/simulation/gz_plugins/optical_flow/optical_flow.cmake: 22dc563a29ee6fe4c42f2605b0965a3d035542c8c049f9b07c734c3b3c60cc49

px4:
  # The upstream release both hosts are based on. This is shared: a profile may
  # differ in how the tree is built, never in which commit it is.
  describe: v1.17.0
  commit: d6f12ad1c4f70ad3230afd7d86e971421e02fef4
  # PX4 vendors its Gazebo assets as a submodule; the worlds and models below
  # come from it, so its commit is part of the baseline.
  gz_submodule_commit: b6127f4ec20de867e215fb5f78ae88b80f371909

gazebo:
  distribution: harmonic

world:
  # The world every nominal scenario flies in. Wind scenarios render their own
  # fixture from `windy.sdf`; see simulation/gazebo/wind_profiles.py.
  baseline: default

# The PX4 files this platform reads or renders fixtures from. A change to any of
# them changes what the evidence means, so each is pinned by content rather than
# by version alone. These are shared across profiles because the build patch
# does not touch them - and that is what makes them the useful signal: a
# mismatch here is real drift, never a platform difference.
files:
  # The airframe the missions fly, and the base the wind overlay is rendered from.
  Tools/simulation/gz/models/x500/model.sdf: cfe92f98360967faa895b77aa8a6fff3fc9b290286e94e45297c4bdd7b62fbf9
  Tools/simulation/gz/models/x500_base/model.sdf: e807dca3406f7cd5cb3d545898601c3ec17e0e5242e25cf467a69df1812cf436
  # The baseline world, the wind fixture's source world, and the server config
  # the wind system is added to.
  Tools/simulation/gz/worlds/default.sdf: 457a363a22c437b788a4aaf1e2335aa149efce4e5b988cdc108065663cd879b2
  Tools/simulation/gz/worlds/windy.sdf: 1289e65a807babe57ee822940ef99d78d666e20d867414cf4353901adb919aca
  Tools/simulation/gz/server.config: 60871c73e32ecde05e008aaf995e1b9c09906ca3dacb143c595522c68d399172
